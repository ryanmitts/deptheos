# The bug report form, opened by the desktop's Help ▸ Report a Problem…
# (`ISSUES_PAGE` in crates/deptheos_gpui/src/main.rs).
name: Bug report
description: Something in Deptheos doesn't work as it should, or it crashed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Don't attach a diagnostics zip, a crash report or photos you don't want seen: email the diagnostics (Help ▸ Save Diagnostics… on the desktop, Settings ▸ Diagnostics ▸ Send Diagnostics… on iOS) to support@deptheos.com and say here that you did.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1. Open a stack of 40 CR3 frames
        2. Choose Depth Map
        3. Click Stack
  - type: input
    id: version
    attributes:
      label: Version
      description: As About Deptheos shows it, with the build after it in parentheses.
      placeholder: 0.2.0 (abc1234 release)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: System
      placeholder: macOS 27.1 (arm64), Windows 11, Ubuntu 24.04, iOS 26.1
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU
      placeholder: Apple M2 Max, NVIDIA GeForce RTX 4070
  - type: textarea
    id: crash
    attributes:
      label: Crash
      description: When Deptheos crashed, its log's PANIC line, if it has one (Help ▸ Show Log Folder on the desktop).
      render: text
  - type: checkboxes
    id: public
    attributes:
      label: Public
      options:
        - label: I understand issues are public, and nothing personal is in this one.
          required: true
