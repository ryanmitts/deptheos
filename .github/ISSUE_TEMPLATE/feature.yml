# The feature request form.
name: Feature request
description: Something Deptheos could do, or do better.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Questions about using the app go to Discussions; something that doesn't work goes in a bug report.
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The photos and the job, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. A sketch or an example is welcome.
    validations:
      required: true
  - type: dropdown
    id: apps
    attributes:
      label: Which apps
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
        - iPhone and iPad
        - Command line
  - type: checkboxes
    id: public
    attributes:
      label: Public
      options:
        - label: I understand issues are public, and nothing personal is in this one.
          required: true
