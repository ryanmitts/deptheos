[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
authors = ["Ryan Mitts"]
license = "GPL-3.0-only"
repository = "https://github.com/ryanmitts/deptheos"
homepage = "https://deptheos.com"
rust-version = "1.93"

[workspace.dependencies]
libm = "0.2.16"
deptheos_gpu = { path = "crates/deptheos_gpu" }
deptheos_core = { path = "crates/deptheos_core" }
deptheos_aligner = { path = "crates/deptheos_aligner" }
deptheos_raw = { path = "crates/deptheos_raw" }
deptheos_dng = { path = "crates/deptheos_dng" }
deptheos_app = { path = "crates/deptheos_app" }
deptheos_render = { path = "crates/deptheos_render" }
deptheos_adjust = { path = "crates/deptheos_adjust" }

# Pinned to 29 (naga_oil 0.22 = naga 29). The GUI does not share this
# device with a toolkit, so the pin is ours to move; gpui-kit's own wgpu
# (Linux renderer) is 29 too, which keeps a single copy in the build.
# DX12 shaders are compiled by wgpu's default, FXC, which Windows ships: no
# shader needs the newer shader models, and DXC linked in would be one more
# library to carry notices for (ADR-100).
# naga-ir: shader modules are built by naga_oil composition and handed to wgpu
# as naga IR rather than WGSL source.
wgpu = { version = "29.0", features = ["naga-ir"] }
naga_oil = { version = "0.22", default-features = false }  # 0.22 = naga 29
encase = { version = "0.10", features = ["glam"] }
# Pinned to the glam version encase 0.10's "glam" feature implements
# ShaderType for — a newer glam is a different crate to the trait system.
glam = "0.29"
bytemuck = "1.21"
# No default features here, so `deptheos_aligner` does not pull in the
# image codecs; every crate that decodes or encodes asks for the formats
# Deptheos reads and writes (JPEG, PNG, TIFF) and rayon, never the
# defaults, which add AV1, EXR, WebP, GIF and more that nothing uses.
image = { version = "0.25", default-features = false }
clap = { version = "4.5", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# The diagnostics zip (deptheos_app::engine::logs). Deflate only; 8.6 rather than
# the 9.x line, which was still changing daily.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
sys-locale = "0.3"
# The shared layer's sentences (deptheos_app::words, ADR-161): Fluent files
# embedded in the binary and read through `fl!`, which checks each message
# id and its arguments against the English file at build time. Debug
# builds embed the files too (`debug-embed`), so a dev build on iOS needs no
# folder beside it.
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
fluent = "0.17"
rust-embed = { version = "8", features = ["debug-embed"] }
pollster = "0.4"
# A render's paint (ADR-148): one SQLite file, the library built in
# (`bundled`, SQLite 3.54.1 here; paint needs 3.51.3 or later). No default
# features, which would add a WebAssembly backend nothing uses.
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
# Timestamp-query pass timing for benches (deptheos_gpu::profile); 0.27 = wgpu 29.
wgpu-profiler = "0.27"
tempfile = "3"
# Tests only: the paint worker's model-based test and the store's
# concurrency test.
proptest = { version = "1.12", default-features = false, features = ["std"] }
proptest-state-machine = "0.9"
shuttle = "0.9"
zstd = "0.13"
libc = "0.2"

# GUI shell: GPUI (Zed's UI framework) via the crates.io snapshots, plus the
# gpui-kit component library. gpui-kit pins its GPUI snapshot exactly (the
# API moves with Zed's releases), so bump all three together to the pair
# gpui-kit's own Cargo.toml names. The GUI composites with GPUI's own
# renderer; the stacking engine's wgpu device is headless and results reach
# the window as CPU pixels (deptheos_app::engine::present).
# gpui-kit enables gpui_platform's `runtime_shaders`, so the Metal shaders
# compile at run time and building needs no Xcode Metal toolchain.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-kit = "=0.7.1"
futures = "0.3"
rfd = "0.15"
# Local dates for the history's day headers.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# CPU alignment (ECC with SIMD)
nalgebra = "0.34"
rayon = "1.11"
rten-simd = "0.24"
fast_image_resize = { version = "5.4", features = ["rayon"] }

# Project store (deptheos_app::project): JSON manifests, time-sortable ids,
# the per-OS data directory, and TIFF with a predictor (the `image` crate's
# TIFF encoder writes uncompressed) where libjxl is not built.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.26", features = ["v7"] }
dirs = "6"
tiff = "0.11"
# Tagged PNG exports (EXIF, XMP), the version `image` uses.
png = "0.18"

# A frame's EXIF block (orientation, the Adobe RGB hint) and a JPEG's
# EXIF thumbnail, without reading past the headers.
kamadak-exif = "0.6"
# Reading and comparing the ICC profiles of standard-image frames
# (deptheos_core::io::profile); the version the `image` crate uses.
moxcms = { version = "0.8", features = ["extended_range"] }

# The GUI's update check: one HTTPS GET to GitHub's latest release, and
# its tag compared with this build's version.
ureq = { version = "3", features = ["json"] }
semver = "1"
# The Windows exe's icon and version details (deptheos_gpui/build.rs).
winresource = "0.1"

# Global allocator for the binaries. A stack allocates and frees several
# frame-sized buffers per frame on the decode threads (decoded pixels, the
# aligner's gray levels); the system allocator on Windows returns each to
# the OS and faults it back in zero-filled page by page on the next frame,
# where mimalloc reuses the memory. Measured on a 16-core
# Windows machine (46 × 45 MP JPEGs, pyramid): 3.1 s → 2.85 s.
mimalloc = "0.1"

# Image processing is hot even in debug sessions; unoptimized builds are unusable
# on real stacks.
[profile.dev]
opt-level = 3

# With debug assertions, objc2 checks each message's selector against the
# receiver's class before sending it. Xcode's GPU Frame Capture wraps the
# Metal device in a proxy that forwards selectors it doesn't declare, so
# wgpu's `supportsShaderBarycentricCoordinates` query (reached on the iOS
# Simulator's GPU) fails that check and panics at launch, though the
# message itself would be answered.
[profile.dev.package.objc2]
debug-assertions = false

# Line tables (no types or variables): a crash's frames read back as
# functions and lines. They stay out of what ships: the macOS dSYM
# (script/bundle-mac.sh runs dsymutil) and the Windows PDB are kept as
# the release workflow's artifacts per tag, the Linux packages are
# stripped, and the iOS archive's dSYM takes the engine's from its
# static library.
[profile.release]
lto = true
codegen-units = 1
debug = "line-tables-only"
