# cargo-about configuration for THIRD_PARTY_NOTICES.txt (script/notices.sh).
# Only the crates that ship: no build tools, no dev-dependencies.
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
targets = [
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-ios",
]
accepted = [
    "GPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "bzip2-1.0.6",
]

# ring's LICENSE only points at the real texts; without this, cargo-about
# lists every source file's ISC header separately.
[ring.clarify]
license = "Apache-2.0 AND ISC"

[[ring.clarify.files]]
path = "LICENSE-other-bits"
license = "ISC"
checksum = "f025ccfb7dfb6bdfedc75ca0f67acc69e6fb4998143d834f7c2f38a29989680f"

[[ring.clarify.files]]
path = "LICENSE-BoringSSL"
license = "Apache-2.0"
checksum = "005fc765ddc5115da796cca915baa9557abae13ff35e0a47c47affc56f6c414d"

# The Lucide icons gpui-kit embeds: ISC, with the Feather-derived ones MIT.
# The crate's own metadata says only Apache-2.0.
[gpui-kit-assets.clarify]
license = "Apache-2.0 AND ISC"

[[gpui-kit-assets.clarify.files]]
path = "LICENSE-LUCIDE"
# One file holding both texts; listed once, as ISC.
license = "ISC"
checksum = "b495047bd93a9b06913511076f504daba17d5bbeb3e0650f3bb53a4220329c57"
