[package]
name = "deptheos_raw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
# Marks this crate as owning the native LibRaw build so cargo links it once.
links = "deptheos_raw"

[dependencies]
thiserror = { workspace = true }

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
native_build = { path = "../native_build" }

[features]
# The examples (benches, web golden/sample generators, probes) build only
# with this on, so `cargo test` does not compile and link them:
#   cargo run --release -p deptheos_raw --features examples --example <name>
examples = []
# `TestMetadata`, LibRaw metadata made up for other crates' tests.
test-support = []

[[example]]
name = "preview_probe"
required-features = ["examples"]
